services:
  neo4j:
    image: neo4j@sha256:6ea87e9f43d1cf6c6a00a709d05aab626c9a5128aded8673804d087c0232434e
    container_name: agreeo_neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env or shell}
    ports:
      - "7474:7474" # HTTP
      - "7687:7687" # Bolt
    volumes:
      - neo4j_data:/data
      - ${MOVIELENS_DATA_DIR:-./backend/data/ml-latest-small}:/var/lib/neo4j/import
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env or shell}", "RETURN 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks:
      - agreeo_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agreeo_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env or shell}
      NEO4J_DATABASE: neo4j
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env or shell}
      TMDB_ACCESS_TOKEN: ${TMDB_ACCESS_TOKEN:?Set TMDB_ACCESS_TOKEN in .env or shell}
      # Console Neo4j read-only nell'app (Settings > Developer): solo demo/dev.
      ENABLE_NEO4J_DEBUG: ${ENABLE_NEO4J_DEBUG:-false}
      ENABLE_DAILY_SWIPE_LIMIT: ${ENABLE_DAILY_SWIPE_LIMIT:-true}
      DAILY_SWIPE_LIMIT: ${DAILY_SWIPE_LIMIT:-20}
      ENABLE_RECOMMENDATION_DEBUG: ${ENABLE_RECOMMENDATION_DEBUG:-false}
      ENABLE_RECOMMENDATION_AB_TEST: ${ENABLE_RECOMMENDATION_AB_TEST:-false}
      SEMANTIC_TOP_K: ${SEMANTIC_TOP_K:-25}
      SEMANTIC_SIMILARITY_THRESHOLD: ${SEMANTIC_SIMILARITY_THRESHOLD:-0.35}
      SEMANTIC_NEGATIVE_PENALTY: ${SEMANTIC_NEGATIVE_PENALTY:-0.75}
      SEMANTIC_RRF_WEIGHT: ${SEMANTIC_RRF_WEIGHT:-0.85}
      AB_SEMANTIC_WEIGHT: ${AB_SEMANTIC_WEIGHT:-1.0}
      RECIPROCAL_RANK_K: ${RECIPROCAL_RANK_K:-60}
      COLLABORATIVE_NEIGHBOR_LIMIT: ${COLLABORATIVE_NEIGHBOR_LIMIT:-50}
      COLLABORATIVE_SUPPORT_SHRINKAGE: ${COLLABORATIVE_SUPPORT_SHRINKAGE:-5.0}
      EMBEDDING_MODEL_ID: ${EMBEDDING_MODEL_ID:-Xenova/multilingual-e5-small}
      EMBEDDING_MODEL_REVISION: ${EMBEDDING_MODEL_REVISION:-761b726dd34fb83930e26aab4e9ac3899aa1fa78}
    ports:
      - "3000:3000"
    depends_on:
      neo4j:
        condition: service_healthy
      neo4j-init:
        condition: service_completed_successfully
      semantic-init:
        condition: service_completed_successfully
    volumes:
      - embedding_cache:/usr/src/app/data
      - model_cache:/usr/src/app/node_modules/@xenova/transformers/.cache
    networks:
      - agreeo_net

  neo4j-init:
    image: neo4j@sha256:6ea87e9f43d1cf6c6a00a709d05aab626c9a5128aded8673804d087c0232434e
    container_name: agreeo_neo4j_init
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ./backend/scripts:/scripts
    entrypoint: >
      bash -c "cypher-shell -a bolt://neo4j:7687 -u neo4j -p '${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env or shell}' -f /scripts/import_movielens.cypher && echo 'Dataset caricato con successo!'"
    networks:
      - agreeo_net

  semantic-init:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agreeo_semantic_init
    environment:
      NODE_ENV: production
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env or shell}
      NEO4J_DATABASE: neo4j
      EMBEDDING_MODEL_ID: ${EMBEDDING_MODEL_ID:-Xenova/multilingual-e5-small}
      EMBEDDING_MODEL_REVISION: ${EMBEDDING_MODEL_REVISION:-761b726dd34fb83930e26aab4e9ac3899aa1fa78}
    command: npm run migrate:embeddings
    depends_on:
      neo4j:
        condition: service_healthy
      neo4j-init:
        condition: service_completed_successfully
    volumes:
      - embedding_cache:/usr/src/app/data
      - model_cache:/usr/src/app/node_modules/@xenova/transformers/.cache
    networks:
      - agreeo_net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BACKEND_BASE_URL: ${BACKEND_BASE_URL:-http://localhost:3000}
    container_name: agreeo_frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - agreeo_net

networks:
  agreeo_net:
    driver: bridge

volumes:
  neo4j_data:
  embedding_cache:
  model_cache:
