services:
  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env.azure}
    ports:
      - "${NEO4J_HTTP_BIND:-127.0.0.1}:7474:7474"
      - "${NEO4J_BOLT_BIND:-127.0.0.1}:7687:7687"
    volumes:
      - neo4j_data:/data
      - ./backend/data/ml-latest-small:/var/lib/neo4j/import:ro
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env.azure}", "RETURN 1"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 30s
    networks:
      - agreeo_net

  neo4j-init:
    image: neo4j:5-community
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env.azure}
    volumes:
      - ./backend/scripts:/scripts:ro
    entrypoint:
      - bash
      - -c
      - |
        cypher-shell -a bolt://neo4j:7687 -u neo4j -p "$$NEO4J_PASSWORD" -f /scripts/import_movielens.cypher
        echo 'MovieLens dataset imported successfully.'
    networks:
      - agreeo_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env.azure}
      NEO4J_DATABASE: neo4j
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.azure}
      TMDB_ACCESS_TOKEN: ${TMDB_ACCESS_TOKEN:?Set TMDB_ACCESS_TOKEN in .env.azure}
      ENABLE_DAILY_SWIPE_LIMIT: ${ENABLE_DAILY_SWIPE_LIMIT:-false}
      DAILY_SWIPE_LIMIT: ${DAILY_SWIPE_LIMIT:-999999}
      ENABLE_RECOMMENDATION_DEBUG: ${ENABLE_RECOMMENDATION_DEBUG:-false}
    ports:
      - "${BACKEND_PUBLIC_PORT:-3000}:3000"
    depends_on:
      neo4j:
        condition: service_healthy
      neo4j-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health/db').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - agreeo_net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BACKEND_BASE_URL: ${BACKEND_BASE_URL:?Set BACKEND_BASE_URL in .env.azure}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PUBLIC_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - agreeo_net

networks:
  agreeo_net:
    driver: bridge

volumes:
  neo4j_data:
